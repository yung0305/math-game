              <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-1 md:gap-2 px-3 py-2 bg-emerald-100 text-emerald-700 rounded-lg hover:bg-emerald-200 font-bold transition-all"><i className="fa-solid fa-file-arrow-up text-xl"></i> <span className="hidden md:inline">本機匯入</span></button>
              <button onClick={handleExport} className="flex items-center gap-1 md:gap-2 px-3 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 font-bold transition-all"><i className="fa-solid fa-file-arrow-down text-xl"></i> <span className="hidden md:inline">備份匯出</span></button>
              <button onClick={onBack} className="flex items-center gap-1 md:gap-2 px-3 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 font-bold transition-all ml-2 md:ml-4"><i className="fa-solid fa-house text-xl"></i> 回主畫面</button>
            </div>
          </div>

          {errorMsg && <div className="mb-4 p-4 bg-red-100 text-red-700 rounded-xl font-bold text-center border border-red-300">{errorMsg}</div>}

          <div className="flex-1 flex flex-col md:flex-row gap-6 overflow-hidden">
            <div className="w-full md:w-2/3 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col overflow-hidden h-1/2 md:h-full">
               <div className="flex justify-between items-center mb-4">
                <h2 className="text-xl font-bold text-slate-700">已建立的主題</h2>
                <button onClick={() => startEdit('', null)} className="flex items-center gap-1 px-3 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold text-sm shadow-sm"><i className="fa-solid fa-plus text-base"></i> 新增主題</button>
              </div>
              <div className="flex-1 overflow-y-auto space-y-3 pr-2 hide-scrollbar">
                {Object.entries(themes).map(([key, theme]) => (
                  <div key={key} className={`flex items-center justify-between p-4 rounded-xl border-2 transition-all ${editingKey === key ? 'border-indigo-400 bg-indigo-50' : 'border-slate-100 bg-slate-50 hover:border-slate-300'}`}>
                    <div><div className="font-bold text-lg text-slate-800">{theme.name}</div><div className="text-slate-500 text-sm font-mono mt-1">代碼: {key}</div><div className="mt-2 text-2xl tracking-widest">{theme.icons.slice(0, 8).join('')}{theme.icons.length > 8 ? '...' : ''}</div></div>
                    <div className="flex gap-1 md:flex-col md:gap-2">
                      <button onClick={() => startEdit(key, theme)} className="p-2 text-blue-600 hover:bg-blue-100 rounded-lg flex items-center justify-center w-10 h-10"><i className="fa-solid fa-pen text-xl"></i></button>
                      <button onClick={() => deleteTheme(key)} className="p-2 text-red-600 hover:bg-red-100 rounded-lg flex items-center justify-center w-10 h-10"><i className="fa-solid fa-trash-can text-xl"></i></button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="w-full md:w-1/3 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col h-1/2 md:h-full overflow-y-auto hide-scrollbar">
              {editingKey !== null ? (
                <div className="flex flex-col h-full animate-[slideIn_0.3s_ease-out]">
                  <div className="flex justify-between items-center mb-6"><h2 className="text-2xl font-bold text-indigo-900">{editingKey === '' ? '✨ 新增主題' : '✏️ 編輯主題'}</h2><button onClick={() => setEditingKey(null)} className="p-2 text-slate-400 hover:bg-slate-100 rounded-full w-10 h-10 flex justify-center items-center"><i className="fa-solid fa-xmark text-2xl"></i></button></div>
                  <div className="space-y-4 md:space-y-6 flex-1">
                    <div><label className="block text-sm font-bold text-slate-700 mb-2">英文代碼</label><input type="text" value={editForm.key} onChange={(e) => setEditForm({...editForm, key: e.target.value.replace(/[^a-zA-Z0-9_-]/g, '')})} disabled={editingKey !== ''} placeholder="例如: shapes" className="w-full p-3 border-2 border-slate-200 rounded-xl focus:border-indigo-500 outline-none font-mono disabled:bg-slate-100" /></div>
                    <div><label className="block text-sm font-bold text-slate-700 mb-2">顯示名稱</label><input type="text" value={editForm.name} onChange={(e) => setEditForm({...editForm, name: e.target.value})} placeholder="例如: 🟢 幾何圖形" className="w-full p-3 border-2 border-slate-200 rounded-xl focus:border-indigo-500 outline-none font-bold" /></div>
                    <div><label className="block text-sm font-bold text-slate-700 mb-2">輸入圖示</label><textarea value={editForm.iconsString} onChange={(e) => setEditForm({...editForm, iconsString: e.target.value})} placeholder="輸入表情符號，如：🟢🟡🔴🔵🔷" className="w-full p-3 border-2 border-slate-200 rounded-xl focus:border-indigo-500 outline-none text-2xl md:text-3xl tracking-widest min-h-[100px] resize-none" /></div>
                  </div>
                  <button onClick={saveEdit} className="w-full py-4 mt-4 bg-indigo-600 text-white font-bold rounded-xl text-xl hover:bg-indigo-700 active:scale-95 flex items-center justify-center gap-2 shadow-md"><i className="fa-solid fa-floppy-disk text-2xl"></i> 儲存設定</button>
                </div>
              ) : (
                <div className="flex-1 flex flex-col items-center justify-center text-slate-400"><i className="fa-solid fa-gear text-[5rem] mb-4 opacity-20"></i><p className="text-lg font-bold">請點擊左側列表的「編輯」</p><p className="text-sm">或點擊「新增主題」來開始設定</p></div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // 掛載 React 應用程式
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
